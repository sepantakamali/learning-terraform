name: Terraform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      
      - name: Check formatting
        run: terraform fmt -check -diff -recursive
 
      - name: Initialise providers and modules
        run: |
          terraform -chdir=oci-lab init -backend=false -input=false
          terraform -chdir=environment-lab/dev init -backend=false -input=false
          terraform -chdir=environment-lab/prod init -backend=false -input=false

      - name: Validate configuration
        run: |
          terraform -chdir=oci-lab validate
          terraform -chdir=environment-lab/dev validate
          terraform -chdir=environment-lab/prod validate

      - name: Initialise compartment module for tests
        run: terraform -chdir=environment-lab/modules/compartment init -backend=false -input=false

      - name: Test compartment module
        run: terraform -chdir=environment-lab/modules/compartment test
